<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Taro — Informatics Student &amp; Developer</title>
  <meta name="description"
    content="Portfolio of Taro, an informatics student building web apps, Linux desktop tooling and homelab setups." />

  <!-- Bone & Ink fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+JP:wght@400;600&display=swap"
    rel="stylesheet" />

  <!-- Pasang tema sebelum React dimuat, supaya warna tidak berkedip saat reload -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('taro-theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        document.documentElement.dataset.theme = theme;
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
